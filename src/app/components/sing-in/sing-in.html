<section class="form-container">
    <div>
        <h2>CREAR CUENTA</h2>
        <p class="form-subtitle">ÚNETE A NUESTRA FAMILIA RUNNER CORE</p>

        <form>
            <div>
                <label for="firstName">Nombre(s):</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div>
                <label for="lastName">Apellidos:</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>

            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>

                <div class="password-requirements">
                    <ul>
                        <li>Mínimo 8 caracteres</li>
                        <li>Al menos un número (0-9)</li>
                        <li>Al menos una mayúscula (A-Z)</li>
                    </ul>
                </div>
            </div>

            <label>Fecha de nacimiento:</label>
            <div class="form-row">
                <div class="form-col">
                    <label for="dob-day" class="label-light">Día:</label>
                    <input type="text" id="dob-day" name="dob-day" placeholder="DD">
                </div>
                <div class="form-col">
                    <label for="dob-month" class="label-light">Mes:</label>
                    <input type="text" id="dob-month" name="dob-month" placeholder="MM">
                </div>
                <div class="form-col">
                    <label for="dob-year" class="label-light">Año:</label>
                    <input type="text" id="dob-year" name="dob-year" placeholder="AAAA">
                </div>
            </div>

            <div>
                <label>Sexo:</label>
                <div class="radio-group">
                    <input type="radio" id="sex-male" name="sex" value="male">
                    <label for="sex-male">Hombre</label>

                    <input type="radio" id="sex-female" name="sex" value="female">
                    <label for="sex-female">Mujer</label>

                    <input type="radio" id="sex-other" name="sex" value="other">
                    <label for="sex-other">No especificar</label>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="marketing" name="marketing">
                <label for="marketing">Quiero recibir noticias, promociones y descuentos exclusivos de Runner
                    Core.</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">Acepto los Términos y Condiciones y la Política de Privacidad.</label>
            </div>

            <button type="button" class="form-button">
                CREAR CUENTA
            </button>
        </form>

        <div class="additional-links">
            <span>¿Ya tienes cuenta? </span>
            <a routerLink="/login">Inicia sesión</a>
        </div>
    </div>
</section>
