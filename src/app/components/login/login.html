<div class="login-container">
    <div class="login-form">
        <img [src]="imagenLogin" alt="Login" class="login-image">

        <h2>Iniciar Sesión</h2>

        <form (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" [(ngModel)]="loginData.correo" (input)="onEmailChange()"
                    placeholder="ej: usuario@puma.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="loginData.contrasena"
                    placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="login-links">
            <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
            <a routerLink="/sing-in">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>
</div>
