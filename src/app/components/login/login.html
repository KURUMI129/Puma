<section>
    <div>
        <h2>Bienvenido</h2>
        <p>Selecciona tu perfil para iniciar sesión.</p>
        <div class="user-type-selector-img">
            <img src="/Recursos/Usuario.jpg" alt="Usuario" [class.active]="userType == 'user'" (click)="setUserType('user')">
            <img src="/Recursos/Administrador.jpg" alt="Administrador" [class.active]="userType == 'admin'" (click)="setUserType('admin')">
        </div>
        <hr>
        <form>
            <div *ngIf="userType == 'user'">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" [(ngModel)]="loginObj.email" required>
            </div>
            <div *ngIf="userType == 'admin'">
                <label for="adminId">ID de Administrador:</label>
                <input type="text" id="adminId" name="adminId" [(ngModel)]="loginObj.adminId" required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" [(ngModel)]="loginObj.password" required>
            </div>
            <div class="password-help-links">
                <a routerLink="/forgot-password" class="forgot-password-link">¿Olvidaste la contraseña?</a>
                <a routerLink="#" class="help-link">
                    <i class="bi bi-question-circle me-1"></i> Ayuda
                </a>
            </div>
            <button type="button" class="login-button" (click)="onLogin()">Iniciar Sesión</button>
        </form>
        <div class="additional-links registration-link">
            <span>¿No tienes una cuenta? </span>
            <a routerLink="/sing-in">Regístrate aquí</a>
        </div>
    </div>
</section>
