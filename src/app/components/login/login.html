<section>  
    <div>
        <h2>Bienvenido</h2>
        <p>Selecciona tu perfil para iniciar sesión.</p>
        <div class="user-type-selector-img">
            <img src="/Recursos/Usuario.jpg" alt="Usuario" [class.active]="userType == 'user'" (click)="userType = 'user'">
            <img src="/Recursos/Administrador.jpg" alt="Administrador" [class.active]="userType == 'admin'" (click)="userType = 'admin'">
        </div>
        <hr>
        <form>
            <div *ngIf="userType == 'user'">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" ngModel required>
            </div>
            <div *ngIf="userType == 'admin'">
                <label for="adminId">ID de Administrador:</label>
                <input type="text" id="adminId" name="adminId" ngModel required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" ngModel required>
            </div>
            <button type="button" [routerLink]="['/home', userType]">Iniciar Sesión</button>
        </form>
    </div>
</section>
